function rr(w,h,d,r){const b=Math.min(r*.7,w*.45,h*.45,d*.45),iw=w-2*b,ih=h-2*b,x=iw/2,y=ih/2,q=Math.max(Math.min(r-b,x-.0005,y-.0005),.0005);
const s=new T.Shape();s.moveTo(-x+q,-y);s.lineTo(x-q,-y);s.absarc(x-q,-y+q,q,-PI/2,0);s.lineTo(x,y-q);s.absarc(x-q,y-q,q,0,PI/2);s.lineTo(-x+q,y);s.absarc(-x+q,y-q,q,PI/2,PI);s.lineTo(-x,-y+q);s.absarc(-x+q,-y+q,q,PI,1.5*PI);

B(1.86,.015,.02,.007,ledA,1.1,1.47,-.97);B(4.0,.02,.02,.008,ledB,0,2.7,-1.97);B(.02,.02,3.9,.008,ledB,-2.07,2.72,0);

// main monitor

const fanM=E(0x22d3ee,2.4);
for(const y of[-.15,0,.15]){const f=new T.Mesh(new T.TorusGeometry(.055,.009,14,40),fanM);f.position.set(-.16,y,.06);TW.add(f);Bl(new T.CylinderGeometry(.015,.015,.01,16).rotateX(PI/2),dk,-.16,y,.06,TW)}

const o=new T.Mesh(new T.PlaneGeometry(.9,.28),new T.MeshBasicMaterial({map:n,transparent:true,blending:T.AdditiveBlending,depthWrite:false,toneMapped:false}));o.position.set(-.55,2.05,-1.97);S.add(o)}

// ---------- sky / time / weather ----------
const K=[[0,0x03050d,0x0b1328,.5,0x9db4ff,.35],[5,0x070b1e,0x1d2547,.35,0x9db4ff,.35],[6,0x2b3a6b,0xff8a5c,1.6,0xffa066,.5],[8,0x4a86d8,0xbcd8f2,3.2,0xfff0d8,.8],[12,0x2f78d6,0xa9d0f2,4.2,0xfff6ea,1],[16,0x3f84d6,0xbad6f0,3.6,0xfff0d0,.9],[18,0x4a5a9a,0xffa05a,2,0xff9a55,.6],[19.5,0x1a2250,0xe0603a,.6,0xff7a50,.4],[21,0x070b1e,0x1d2547,.5,0x9db4ff,.35],[24,0x03050d,0x0b1328,.5,0x9db4ff,.35]];
const WX={clear:{sun:1,grey:0,dark:1,n:5},clouds:{sun:.45,grey:.5,dark:.85,n:14},rain:{sun:.25,grey:.75,dark:.65,n:18},snow:{sun:.4,grey:.6,dark:.9,n:18},storm:{sun:.12,grey:.85,dark:.45,n:18}};
let weather='clear',flash=0;
function hour(){const d=new Date();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600}
function apply(){
  const h=hour();let i=0;while(i<K.length-2&&h>=K[i+1][0])i++;const a=K[i],b=K[i+1],t=(h-a[0])/(b[0]-a[0]),C=x=>new T.Color(x);
  let top=C(a[1]).lerp(C(b[1]),t),hor=C(a[2]).lerp(C(b[2]),t),sc=C(a[4]).lerp(C(b[4]),t),si=a[3]+(b[3]-a[3])*t,hi=a[5]+(b[5]-a[5])*t;
  const W=WX[weather],lum=(top.r+top.g+top.b)/3,night=Math.min(Math.max(1-lum/.12,0),1),gr=new T.Color().setScalar(lum*1.1+.05);
  top.lerp(gr,W.grey).multiplyScalar(W.dark);hor.lerp(gr,W.grey*.8).multiplyScalar(W.dark);
  const g=skyC.getContext('2d').createLinearGradient(0,0,0,512),H=c=>'#'+c.getHexString();
  g.addColorStop(0,H(top));g.addColorStop(.42,H(top.clone().lerp(hor,.75)));g.addColorStop(.5,H(hor));g.addColorStop(.52,H(hor.clone().multiplyScalar(.55)));g.addColorStop(1,H(hor.clone().multiplyScalar(.3)));
  const cx=skyC.getContext('2d');cx.fillStyle=g;cx.fillRect(0,0,4,512);skyT.needsUpdate=true;
  S.fog.color.copy(hor);ground.material.color.copy(hor).multiplyScalar(.25);
  const day=h>=6&&h<18.5,pr=day?(h-6)/12.5:(((h-18.5)+24)%24)/11.5,el=Math.sin(pr*PI)*.95,hz=-(.25+pr*.85);
  const dir=new T.Vector3(-Math.cos(el),Math.sin(el),Math.cos(el)*hz).normalize();
  sunL.position.copy(dir).multiplyScalar(10).add(sunL.target.position);sunL.color.copy(sc);sunL.intensity=si*W.sun;
  hemi.color.copy(hor).lerp(new T.Color(1,1,1),.35);hemi.intensity=hi*(1+.4*W.grey);
  sunS.position.copy(dir).multiplyScalar(120).add(sky.position);sunS.material.color.copy(sc);sunS.scale.setScalar(day?26:12);sunS.material.opacity=Math.max(0,1-W.grey*1.25);
  stars.material.opacity=night*Math.max(0,1-W.grey*1.3);
  const cc=hor.clone().lerp(new T.Color(1,1,1),.4).multiplyScalar(1.15*Math.sqrt(W.dark));
  clouds.forEach((s,k)=>{s.material.color.copy(cc);s.material.opacity=k<W.n?(weather==='clear'?.35:.55+.4*W.grey):0});
  bm.forEach(m=>m.emissiveIntensity=night*1.3+.05);
  rain.visible=weather==='rain'||weather==='storm';snow.visible=weather==='snow';
  skyM.color.setScalar(1+flash*2.5);
}
function drawScreens(){scrTex.forEach(t=>{t.draw(t.c.getContext('2d'),t.c.width,t.c.height);t.needsUpdate=true})}
const ui=document.getElementById('ui'),btns={};
Object.keys(WX).forEach(k=>{const b=document.createElement('button');b.textContent=k[0].toUpperCase()+k.slice(1);b.onclick=()=>setW(k);ui.appendChild(b);btns[k]=b});
function setW(k){weather=k;for(const j in btns)btns[j].classList.toggle('on',j===k);apply()}
setW(WX[location.hash.slice(1)]?location.hash.slice(1):'clear');drawScreens();
// ---- launcher API: ?app hides the buttons, ?lite = 30fps, no shadows (for weak TV GPUs)
const lite=/lite/.test(location.search);
if(/app/.test(location.search))ui.style.display='none';
if(lite){R.setPixelRatio(1);R.shadowMap.enabled=false;sunL.castShadow=false}
window.glass={setFocus(x,y){tx=Math.max(-1,Math.min(1,x))*.5;ty=Math.max(-1,Math.min(1,y))*.5},setWeather(k){if(WX[k])setW(k)}};

// ---------- loop ----------
let t0=performance.now(),acc=0,nextL=4;
function loop(now){requestAnimationFrame(loop);if(lite&&now-t0<33)return;const dt=Math.min((now-t0)/1000,.05);t0=now;acc+=dt;
  mx+=(tx-mx)*Math.min(1,dt*3);my+=(ty-my)*Math.min(1,dt*3);
  cam.position.set(base.x+mx*.3+Math.sin(now/6000)*.04,base.y-my*.12,base.z);cam.lookAt(look.x+mx*.35,look.y-my*.1,look.z);
  const hu=(now/12000)%1;ledA.emissive.setHSL(hu,1,.5);ledB.emissive.setHSL((hu+.5)%1,1,.5);fanM.emissive.setHSL((hu+.2)%1,1,.5);
  ledL.color.setHSL((hu+.5)%1,1,.55);ledU.color.setHSL(hu,1,.55);pcL.color.setHSL((hu+.2)%1,1,.55);
  if(acc>20){acc=0;apply();drawScreens()}
  if(weather==='rain'||weather==='storm'){for(let i=0;i<RN;i++){let y=rp[i*6+1]-24*dt;if(y<-5)y+=24;rp[i*6+1]=y;rp[i*6+4]=y+.7}rainG.attributes.position.needsUpdate=true}
  if(weather==='snow'){for(let i=0;i<SN;i++){let y=sp[i*3+1]-(1.2+(i%5)*.3)*dt;if(y<-5)y+=24;sp[i*3+1]=y;sp[i*3]+=Math.sin(now/900+i)*.01}snowG.attributes.position.needsUpdate=true}
  if(weather==='storm'){nextL-=dt;if(nextL<0){flash=1;nextL=3+rnd()*7}}
  if(flash>.01){flash*=Math.exp(-dt*7);skyM.color.setScalar(1+flash*2.5);hemi.intensity+=flash*.02*0;sunL.intensity=Math.max(sunL.intensity,flash*2)}else if(flash){flash=0;apply()}
  R.render(S,cam)}
requestAnimationFrame(loop);
</script></body></html>
